version: 2

models:
  - name: mart_bay_area_price_trends
    description: >
      Monthly price history for each Bay Area county (Jan 2012 – present):
      median sale price, YoY change, $/sqft, a 12-month moving average, and
      percent-off-all-time-peak. The table a price-trend dashboard reads from.
    columns:
      - name: county
        tests:
          - not_null
      - name: period_begin
        tests:
          - not_null
      - name: median_sale_price
        tests:
          - not_null

  - name: mart_bay_area_scorecard
    description: >
      One row per Bay Area county for the latest available month: price,
      sales, inventory, months of supply, days on market, sale-to-list —
      plus a seller/balanced/buyer market_tilt label. The table a
      county-comparison view reads from.
    columns:
      - name: county
        tests:
          - unique
          - not_null
      - name: as_of_month
        tests:
          - not_null

  - name: mart_property_type_trends
    description: "Monthly price history for each Bay Area county and property type, excluding the All Residential aggregate. Grain is county, month, and property type."
    columns:
      - name: property_type
        description: "One of the four component property types."
        tests:
          - accepted_values:
              values: ['Condo/Co-op', 'Multi-Family (2-4 Unit)', 'Single Family Residential', 'Townhouse']
      - name: ma_data_quality
        description: "full window when the 12-month average rests on 12 consecutive months of prices, otherwise insufficient data."
        tests:
          - not_null
          - accepted_values:
              values: ['full window', 'insufficient data']
