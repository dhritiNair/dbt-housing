version: 2

models:
  - name: stg_redfin__county_market
    description: >
      Cleaned monthly county housing metrics, one row per county per month per property type. 
      Types are cast, columns renamed to snake_case, grain key added.
    columns:
      - name: market_key
        description: Surrogate key for the grain (county + month + property type).
        tests:
          - unique
          - not_null
      - name: county
        description: County name, e.g. 'Alameda County, CA'.
        tests:
          - not_null
      - name: property_type
        description: "Redfin property type. All Residential is the aggregate of the four component types."
        tests:
          - accepted_values:
              values: ['All Residential', 'Condo/Co-op', 'Multi-Family (2-4 Unit)', 'Single Family Residential', 'Townhouse']
      - name: period_begin
        description: First day of the observation month.
        tests:
          - not_null
      - name: state_code
        description: Two-letter state code; always CA in this project.
        tests:
          - accepted_values:
              values: ['CA']
      - name: median_sale_price
        description: Median closed sale price for the month.
        tests:
          - not_null
      - name: median_sale_price_yoy
        description: Year-over-year change in median sale price (decimal, e.g. 0.05 = +5%).
      - name: homes_sold
        description: Homes sold (closed) in the month.
      - name: inventory
        description: Active listings at month end.
      - name: months_of_supply
        description: Inventory / monthly sales pace. <3 = seller's market.
      - name: median_dom
        description: Median days on market for sold homes.
      - name: avg_sale_to_list
        description: Average sale-to-list price ratio (decimal, e.g. 1.02 = 2% over asking).
  - name: mart_property_type_trends
    description: "Monthly price history for each Bay Area county and property type, excluding the All Residential aggregate. Grain is county, month, and property type."
    columns:
      - name: property_type
        description: "One of the four component property types."
        tests:
          - accepted_values:
              values: ['Condo/Co-op', 'Multi-Family (2-4 Unit)', 'Single Family Residential', 'Townhouse']
      - name: ma_data_quality
        description: "full window when the 12-month average rests on 12 consecutive months of prices, otherwise insufficient data."
        tests:
          - not_null
          - accepted_values:
              values: ['full window', 'insufficient data']