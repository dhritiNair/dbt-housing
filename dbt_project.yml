name: 'bay_area_housing'
version: '1.0.0'
config-version: 2

# This project analyzes Bay Area housing market trends using
# Redfin's public market tracker data, modeled with dbt.

profile: 'bay_area_housing'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  bay_area_housing:
    staging:
      +materialized: view
      +docs:
        node_color: "lightblue"
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      +docs:
        node_color: "lightgreen"

seeds:
  bay_area_housing:
    +quote_columns: false
